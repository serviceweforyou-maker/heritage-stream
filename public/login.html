<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZKHEWYB53Q"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-ZKHEWYB53Q');
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HeritageStream Console | Admin Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gold: '#d4af37',
            crimson: '#e63946',
            darkSlate: '#0a0b10',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#07080c] text-gray-100 min-h-screen flex items-center justify-center p-6 selection:bg-gold selection:text-black">
  <div class="w-full max-w-md bg-white/5 border border-white/10 p-8 rounded-3xl space-y-6 backdrop-blur-xl relative overflow-hidden">
    <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-gold to-amber-500"></div>
    <div class="absolute top-0 right-0 w-32 h-32 bg-gold/5 rounded-full blur-2xl pointer-events-none"></div>

    <div class="text-center space-y-2">
      <span class="text-4xl block">⚜️</span>
      <h2 class="text-2xl font-bold font-serif text-white tracking-wider text-gradient-gold">Console Gateway</h2>
      <p class="text-xs text-white/50">Enter authorized credentials to access admin database tools.</p>
    </div>

    <form id="login-form" class="space-y-4">
      <div id="error-msg" class="hidden text-xs text-red-400 bg-red-500/10 border border-red-500/20 p-3.5 rounded-xl text-center font-medium animate-pulse"></div>

      <div>
        <label class="text-[10px] font-bold text-white/50 uppercase tracking-widest block mb-1.5">Email Address</label>
        <input type="email" id="email" placeholder="admin@example.com" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 text-white focus:border-gold/50 focus:outline-none" required>
      </div>

      <div>
        <label class="text-[10px] font-bold text-white/50 uppercase tracking-widest block mb-1.5">Security Password</label>
        <div class="relative flex items-center">
          <input type="password" id="password" placeholder="••••••••••••" class="w-full bg-white/5 border border-white/10 rounded-xl pl-4 pr-11 py-2.5 text-white focus:border-gold/50 focus:outline-none" required>
          <button type="button" onclick="window.togglePasswordVisibility('password', this)" class="pwd-toggle-btn absolute right-3 top-1/2 -translate-y-1/2 text-white/50 hover:text-gold transition-colors p-1.5 cursor-pointer flex items-center justify-center focus:outline-none" title="Show / Hide Password">
            <svg class="eye-open-icon w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
            <svg class="eye-closed-icon w-4 h-4 hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="w-full py-3 bg-gradient-to-r from-gold to-amber-500 hover:from-gold/90 hover:to-amber-600 text-black font-extrabold rounded-xl tracking-wider uppercase transition-all shadow-lg shadow-gold/15">
        Unlock Console
      </button>
    </form>

    <div class="text-center">
      <a href="index.html" class="text-[11px] text-white/40 hover:text-gold transition-colors font-medium">← Back to Platform Homepage</a>
    </div>
  </div>

  <script>
    const API_BASE = '';

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('error-msg');

      errorMsg.classList.add('hidden');

      try {
        const res = await fetch(API_BASE + '/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        if (res.ok) {
          const data = await res.json();
          if (data.token) {
            localStorage.setItem('hs_admin_token', data.token);
          }
          window.location.href = 'admin.html';
        } else {
          const data = await res.json();
          errorMsg.textContent = data.error || "Authentication failed.";
          errorMsg.classList.remove('hidden');
        }
      } catch (err) {
        errorMsg.textContent = "Server communication error.";
        errorMsg.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
