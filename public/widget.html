<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sanatana360 Embeddable Live Widget</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-cinzel { font-family: 'Cinzel', serif; }
  </style>
</head>
<body class="bg-[#0b0c10] text-gray-100 p-4 m-0 flex flex-col justify-between h-screen box-border select-none">
  <div class="space-y-3">
    <div class="flex items-center justify-between border-b border-white/10 pb-2.5">
      <div class="flex items-center gap-2">
        <span class="text-xl">⚜️</span>
        <span class="font-cinzel font-bold text-amber-400 text-sm tracking-wide">Sanatana360 Live</span>
      </div>
      <span class="px-2 py-0.5 rounded-full bg-red-600/20 border border-red-500/30 text-red-400 text-[10px] font-bold uppercase tracking-wider animate-pulse">● LIVE 24/7</span>
    </div>
    
    <div class="relative rounded-xl overflow-hidden bg-black/60 border border-amber-400/20 aspect-video group">
      <img src="https://www.sanatana360.com/images/kashi.jpg" alt="Kashi Vishwanath Live" class="w-full h-full object-cover">
      <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-transparent flex flex-col justify-end p-3">
        <span class="text-xs text-amber-300 font-bold uppercase tracking-wider font-mono">Shri Kashi Vishwanath</span>
        <p class="text-[11px] text-white/80 line-clamp-1">Maha Aarti &amp; 24/7 Live Stream from Varanasi, Uttar Pradesh</p>
      </div>
    </div>
  </div>

  <div class="pt-3 border-t border-white/10 flex items-center justify-between text-xs">
    <a href="https://www.sanatana360.com/divya-darshana.html" target="_blank" rel="noopener" class="text-amber-400 hover:underline font-bold flex items-center gap-1">
      Watch 40+ Live Temples &rarr;
    </a>
    <a href="https://www.sanatana360.com/" target="_blank" rel="noopener" class="text-gray-400 text-[10px] hover:text-white">
      Powered by Sanatana360
    </a>
  </div>
</body>
</html>
